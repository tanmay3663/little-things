sh<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Things</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(ellipse at 50% 30%, #fef6f8 0%, #fdf0f3 50%, #f8e4e9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2d2d2d;
            opacity: 0;
            animation: pageLoad 0.6s ease forwards;
            overflow: hidden;
            position: relative;
        }

        @keyframes pageLoad {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 16px;
            }
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: #fffbfc;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 2px 16px rgba(180, 60, 80, 0.1);
            border: 1px solid rgba(210, 130, 150, 0.15);
            width: 100%;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4808f, #c45a6e, #d4808f, transparent);
        }

        .card.transitioning {
            transform: scale(0.96);
            opacity: 0.4;
        }

        @media (max-width: 380px) {
            .card {
                padding: 32px 24px;
                min-height: 240px;
            }
        }

        .prompt {
            font-size: 22px;
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            color: #2d2d2d;
            margin-bottom: 32px;
            transition: opacity 0.4s ease;
        }

        @media (max-width: 380px) {
            .prompt {
                font-size: 20px;
            }
        }

        .prompt::after {
            content: '\2661';
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: #dba8b2;
            letter-spacing: 8px;
        }

        .card-image {
            width: calc(100% + 64px);
            margin: -40px -32px 24px -32px;
            max-height: 280px;
            object-fit: cover;
            border-radius: 16px 16px 0 0;
            display: none;
        }

        .card-image.visible {
            display: block;
        }

        .card-image.photo-only {
            margin: -40px -32px -40px -32px;
            max-height: 400px;
            border-radius: 16px;
        }

        @media (max-width: 380px) {
            .card-image {
                width: calc(100% + 48px);
                margin: -32px -24px 20px -24px;
            }
            .card-image.photo-only {
                margin: -32px -24px -32px -24px;
            }
        }

        .answer {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.6;
            text-align: center;
            color: #6b5055;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
        }

        .answer.visible {
            opacity: 1;
            max-height: 500px;
            margin-top: 24px;
            animation: typewriter 1.2s steps(40) forwards;
        }

        @media (max-width: 380px) {
            .answer {
                font-size: 16px;
            }
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        button {
            background: #c45a6e;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        button:hover {
            background: #b04d60;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: transparent;
            color: #c45a6e;
            border: 1px solid #e8c4ca;
        }

        button.secondary:hover {
            background: #fdf2f4;
            border-color: #c45a6e;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: #c45a6e;
            transform: none;
        }

        button.secondary:disabled:hover {
            background: transparent;
        }

        .footer {
            font-size: 13px;
            color: #d4a0aa;
            text-align: center;
            margin-top: 40px;
            font-weight: 300;
        }

        .fade-enter {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typewriter {
            0% {
                opacity: 0;
            }
            1% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }

        /* Floating hearts */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 18px;
            color: #e0b0b8;
            opacity: 0;
            animation: floatHeart linear infinite;
        }

        .heart:nth-child(1)  { left: 5%;  font-size: 14px; animation: floatHeart1 12s linear infinite 0s; }
        .heart:nth-child(2)  { left: 15%; font-size: 10px; animation: floatHeart2 14s linear infinite 1s; }
        .heart:nth-child(3)  { left: 25%; font-size: 16px; animation: floatHeart3 11s linear infinite 3s; }
        .heart:nth-child(4)  { left: 35%; font-size: 12px; animation: floatHeart1 15s linear infinite 0.5s; }
        .heart:nth-child(5)  { left: 45%; font-size: 14px; animation: floatHeart2 13s linear infinite 4s; }
        .heart:nth-child(6)  { left: 55%; font-size: 10px; animation: floatHeart3 12s linear infinite 2s; }
        .heart:nth-child(7)  { left: 65%; font-size: 15px; animation: floatHeart1 14s linear infinite 5s; }
        .heart:nth-child(8)  { left: 75%; font-size: 11px; animation: floatHeart2 11s linear infinite 1.5s; }
        .heart:nth-child(9)  { left: 85%; font-size: 13px; animation: floatHeart3 13s linear infinite 3.5s; }
        .heart:nth-child(10) { left: 92%; font-size: 10px; animation: floatHeart1 15s linear infinite 6s; }
        .heart:nth-child(11) { left: 10%; font-size: 12px; animation: floatHeart2 12s linear infinite 7s; }
        .heart:nth-child(12) { left: 40%; font-size: 14px; animation: floatHeart3 14s linear infinite 8s; }

        @keyframes floatHeart1 {
            0%   { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.25; }
            50%  { transform: translateY(45vh) translateX(30px) rotate(15deg); }
            90%  { opacity: 0.25; }
            100% { transform: translateY(-10vh) translateX(-20px) rotate(-10deg); opacity: 0; }
        }

        @keyframes floatHeart2 {
            0%   { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.2; }
            35%  { transform: translateY(65vh) translateX(-25px) rotate(-12deg); }
            70%  { transform: translateY(25vh) translateX(20px) rotate(18deg); }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-10vh) translateX(10px) rotate(5deg); opacity: 0; }
        }

        @keyframes floatHeart3 {
            0%   { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.22; }
            25%  { transform: translateY(72vh) translateX(20px) rotate(10deg); }
            50%  { transform: translateY(45vh) translateX(-15px) rotate(-8deg); }
            75%  { transform: translateY(18vh) translateX(25px) rotate(20deg); }
            90%  { opacity: 0.22; }
            100% { transform: translateY(-10vh) translateX(-10px) rotate(-5deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts">
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
        <span class="heart">&hearts;</span>
    </div>
    <div class="container">

            <button id="nextPromptBtn">Ask me something about Mali</button>

        <div class="footer">made with love &hearts;</div>
    </div>

            { id: 10, prompt: "What's one tiny detail about Mali that you find insanely cute?", answer: "her big bug eyes that sparkle when she yaps. cannot be beat." },
            { id: 11, prompt: "When Mali is tired, what's your favorite version of her?", answer: "when she sploots on me under the blanket but keeps one leg out because otherwise it's too hot. very specific. very mali." },
            { id: 12, prompt: "When Mali is excited, what do you love most about the way she lights up?", answer: "she literally becomes a jumping bean. can't stay still. it's adorable." },

            { id: 18, prompt: "When Mali is unsure, what do you love about her anyway?", answer: "she doesn't pretend to have it figured out. she's just real about it." },
            { id: 19, prompt: "At the end of a long day, what about Mali feels like home?", answer: "her daily recap. and scrolling through reels together before bed. just... routine. us." },
            { id: 20, prompt: "When Mali is happy, what's your favorite thing to witness?", answer: "her happy dances. idk what else to say. they're just... the best." },
            { id: 21, prompt: "Complete the sentence: \"My favorite Mali habit is ___.\"", answer: "no matter how incapacitated she is, her gcal will be filled." },
            { id: 22, prompt: "What's a small thing Mali does that instantly improves your mood?", answer: "the way her face lights up after a good burrito. pure joy." },
            { id: 23, prompt: "What's your favorite thing about Mali's laugh—when does it show up?", answer: "after a stupid reel. and then she slaps me until i pay attention and watch it too." },
            { id: 24, prompt: "What's your favorite thing about Mali's voice (and when you hear it most)?", answer: "her excitement when she has a fun story to tell. she gets so into it." },
            { id: 25, prompt: "What's something about Mali that always makes you smile?", answer: "she takes ownership of what she does." },
            { id: 26, prompt: "How does Mali show care in the little moments?", answer: "TODO" },
            { id: 27, prompt: "What's something you love about the way Mali thinks or reasons?", answer: "TODO" },
            { id: 28, prompt: "What's something Mali does that proves she's kinder than she realizes?", answer: "she puts more consideration into others than they put into her. every time." },
            { id: 29, prompt: "What's something about Mali that makes hard days easier?", answer: "24/7 partner to rant to. she's just... there. always." },
            { id: 30, prompt: "What's something about Mali that makes life feel lighter?", answer: "her whimsy and silly jokes. they're dumb. they're perfect." },

            { id: 34, prompt: "If you had to describe Mali in three words, what are they—and why those?", answer: "unyielding, talkative, gorjus. i think this goes without explanation." },
            { id: 35, prompt: "What's something about Mali that makes you go \"how are you real\"?", answer: "she's beautiful, smart, hardworking, and silly all at once. how does that combination even exist." },
            { id: 36, prompt: "What's one thing you love about Mali today?", answer: "her asking to sleep in just a little longer." },
            { id: 37, prompt: "What's a Mali reaction you could watch on repeat?", answer: "when she gets good food, she does this little happy wiggle. every time. and she knows she does it." },
            { id: 38, prompt: "When does Mali completely lose her composure?", answer: "when she sees a cute animal. full-on squeal. zero shame. it's the purest thing." },
            { id: 39, prompt: "When does Mali's protective side come out?", answer: "when someone she cares about is being treated unfairly. she won't just sit there. she'll step in, no hesitation." },
            { id: 40, prompt: "What's your most niche hobby that involves Mali?", answer: "curating my 'mali standing' collection. she'll just be existing and somehow standing like a sim that got their path blocked." },
            { id: 41, prompt: "What's something Mali does that makes your whole day?", answer: "when she's dressed up and sends a million snaps. i save every single one. for later." },
            { id: 42, prompt: "What's the cutest thing Mali does on FaceTime?", answer: "she brings her forehead closer to the camera for a kiss. every time. it kills me." },
            { id: 43, prompt: "What face does Mali make that absolutely sends you?", answer: "her mischievous face. she thinks she looks sneaky. she looks like an alien. i love it." },
            { id: 44, prompt: "What's something about Mali you can always count on?", answer: "she cannot hide a single emotion. angry, excited, annoyed, happy — it's all right there on her face. no poker face. ever." },
            { id: 45, prompt: "What's Mali's most lethal texting weapon?", answer: "her endless collection of cat reaction pics. for every situation. especially the angry ones. 'you don't love me so i go bye bye' with a sad cat attached. devastating." },
            { id: 46, prompt: "What's something about Mali's brain that low-key blows your mind?", answer: "she speaks punjabi, english, spanish, and more. just casually. like it's nothing. it's not nothing. that's insane." },
            { id: 47, prompt: "What's the funniest thing you see on FaceTime that Mali doesn't realize?", answer: "when she facetimes in the shower, all i see is her little forehead bobbing up and down. just a forehead. living its best life." },
            { id: 48, prompt: "What's a Mali look that never fails to make you laugh?", answer: "the hair turban after a shower. she looks like a young punjabi boy. i will never not find this funny." },
            { id: 49, prompt: "What's your ideal day with Mali?", answer: "eat something disgustingly good. then rot together on the couch. no plans. no moving. just us and food comas." },
            { id: 50, prompt: "What's the secret to making Mali happy?", answer: "food. a snuggle. a kiss. that's it. that's the whole list. she's the simplest person to make happy and it's my favorite thing about her." },
            { id: 51, prompt: "What's Mali's most non-negotiable daily ritual?", answer: "her addiction to an iced coffee, no matter how cold or how sick she is. whatever the state she will have one" },
            { id: 52, prompt: "What's Mali's funniest contradiction?", answer: "her shyness around my family - she will steal our entire fridge but will not be ready to talk to my mom" },
            { id: 53, prompt: "What happens when Mali sees a photo of herself?", answer: "her analysis on every photo that has her in it -- even if it is a couples photo shoot day, we better get good mali photos" },
            { id: 54, prompt: "What's Mali's most adorable study ritual?", answer: "the joy she gets making her cheatsheets w all of her different colored writing utensils" },
            { id: 55, prompt: "What makes even the boring parts of life better with Mali?", answer: "how she makes errands into adventures" },
            { id: 56, prompt: "What's something about Mali's work ethic that impresses you every time?", answer: "the devotion she has to what's she doing, and the sheer amt of organization and planning she does towards it" },
            { id: 57, image: "CDDCBD84-5EB4-465B-89A4-395CC7BD910C.JPG" },
            { id: 58, image: "IMG_1831.JPG" },
            { id: 59, image: "IMG_3991.jpg" },
            { id: 60, image: "IMG_4911.JPG" },
            { id: 61, image: "IMG_5870.JPG" },
            { id: 62, image: "IMG_5881.JPG" },
            { id: 63, image: "IMG_6102.jpg" },
            { id: 64, image: "IMG_6218.jpg" },
            { id: 65, image: "IMG_7667.jpg" },
            { id: 66, image: "Photo on 1-3-25 at 3.56 PM.jpeg" }
        ];

        // State
        let shuffledDeck = [];
        let currentIndex = -1;
        let isAnswerRevealed = false;

        // Elements
        const promptEl = document.getElementById('prompt');
        const answerEl = document.getElementById('answer');
        const cardImageEl = document.getElementById('cardImage');
        const nextPromptBtn = document.getElementById('nextPromptBtn');
        const revealBtn = document.getElementById('revealBtn');
        const cardEl = document.querySelector('.card');

        // Shuffle function (Fisher-Yates)
        function shuffle(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialize shuffled deck
        function initDeck() {
            // Filter out TODO cards and split
            const completedCards = deck.filter(card => card.answer !== "TODO");
            const mainDeck = completedCards.slice(0, -1);  // All except last
            const finalCard = completedCards[completedCards.length - 1];  // Card 36

            // Shuffle only the main deck
            const shuffledMain = shuffle(mainDeck);

            // Combine: shuffled main + fixed final card
            shuffledDeck = shuffledMain.concat(finalCard);
            currentIndex = -1;
        }

        // Show next prompt
        function showNextPrompt() {
            // Add transition effect
            cardEl.classList.add('transitioning');

            setTimeout(() => {
                currentIndex++;

                // Reset if we've gone through all cards
                if (currentIndex >= shuffledDeck.length) {
                    initDeck();  // Use initDeck to maintain card 36 at end
                    currentIndex = 0;
                }

                const card = shuffledDeck[currentIndex];

                // Reset answer state
                isAnswerRevealed = false;
                answerEl.classList.remove('visible');
                answerEl.textContent = '';

                const isPhotoOnly = card.image && !card.prompt;

                // Update image
                if (card.image) {
                    cardImageEl.src = 'images/' + card.image;
                    cardImageEl.classList.add('visible');
                    cardImageEl.classList.toggle('photo-only', isPhotoOnly);
                } else {
                    cardImageEl.classList.remove('visible', 'photo-only');
                    cardImageEl.removeAttribute('src');
                }

                // Update prompt
                promptEl.textContent = card.prompt || '';
                promptEl.style.display = isPhotoOnly ? 'none' : '';

                // Update button states
                if (isPhotoOnly) {
                    revealBtn.style.display = 'none';
                    nextPromptBtn.disabled = false;
                } else {
                    revealBtn.style.display = '';
                    revealBtn.disabled = false;
                    nextPromptBtn.disabled = true;
                }
                nextPromptBtn.textContent = 'Next question';

                // Remove transition effect
                setTimeout(() => {
                    cardEl.classList.remove('transitioning');
                }, 50);
            }, 200);
        }

        // Reveal answer
        function revealAnswer() {
            if (isAnswerRevealed) return;

            const card = shuffledDeck[currentIndex];
            answerEl.textContent = card.answer;

            // Show answer with typewriter effect
            setTimeout(() => {
                answerEl.classList.add('visible');
            }, 50);

            isAnswerRevealed = true;
            revealBtn.disabled = true;
            nextPromptBtn.disabled = false;
        }

        // Event listeners
        nextPromptBtn.addEventListener('click', showNextPrompt);
        revealBtn.addEventListener('click', revealAnswer);

        // Initialize
        initDeck();
    </script>
</body>
</html>
